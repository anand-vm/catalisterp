{# base.html #}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/alpinejs" defer></script>
</head>
<body class="font-sans antialiased bg-gray-50">
    <header class="bg-gradient-to-r from-blue-500 to-indigo-600 text-white py-4">
        <div class="container mx-auto flex justify-between items-center px-4">
            <h1 class="text-xl font-bold">CatalistERP</h1>
            <nav>
                <ul class="flex space-x-6">
                    <li><a href="#features" class="hover:underline">Features</a></li>
                    <li><a href="#modules" class="hover:underline">Modules</a></li>
                    <li><a href="#login" class="hover:underline">Login</a></li>
                    <li><a href="#contact" class="hover:underline">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        {% block content %}
        {% endblock %}
    </main>
    <footer class="bg-gray-800 text-white py-6">
        <div class="container mx-auto text-center">
            <p>&copy; 2025 CatalistERP. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
